<!--
  Plugin icon: original artwork for this plugin — two circular arrows in the
  DeepSeek blue, standing for sessions exchanged between machines. No
  third-party asset is reproduced here. The Harness Plugin Manager and the
  Settings plugin inventory read it through the "./icon" export without
  activating the plugin.
-->
